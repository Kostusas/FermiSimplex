name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distributions:
    name: Build release distributions
    uses: ./.github/workflows/build-distributions.yml
    with:
      build-selector: cp311-* cp312-* cp313-*
      release-tag: ${{ github.event_name == 'push' && github.ref_name || '' }}

  pyodide:
    uses: ./.github/workflows/build-pyodide.yml

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [distributions, pyodide]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fermisimplex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [distributions, pyodide]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/fermisimplex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: distribution-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  publish-browser-wheel:
    name: Attach browser wheel to release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-pypi, pyodide]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-wheel-pyodide-0.28.3
          path: browser-wheel

      - name: Publish browser release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "FermiSimplex $RELEASE_TAG" \
              --notes "Native wheels are on PyPI. The attached browser wheel targets Pyodide 0.28.3; load scipy before importing FermiSimplex. See docs/webassembly.md for usage." \
              "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" browser-wheel/*.whl --clobber
